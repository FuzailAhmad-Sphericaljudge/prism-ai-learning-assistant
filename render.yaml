services:
  - type: web
    name: prism-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "PRISM API"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONPATH
        value: ".."
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
